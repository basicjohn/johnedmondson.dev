name: CI

on:
  push:
    branches:
      - master
      - portfolio
      - "dependabot/**"
  pull_request:
    branches:
      - master
      - portfolio

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high --omit=dev
