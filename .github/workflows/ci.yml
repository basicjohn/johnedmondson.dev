name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "*"
      - "dependabot/**"

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        # v5 of both actions run on Node 24; v4 ran on Node 20, which GitHub
        # now forces up to 24 with a deprecation warning. The app itself
        # still builds on Node 20, matching amplify.yml.
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      # Emits out/ — the static export Amplify serves. Catches the
      # case-sensitivity and export-compatibility failures that a macOS
      # dev machine will not reproduce.
      - name: Build static export
        run: npm run build

      - name: Verify the CMS is absent from the export
        run: |
          if find out -iname '*admin*' -o -iname '*api*' | grep -q .; then
            echo "::error::admin or api paths leaked into the static export"
            find out -iname '*admin*' -o -iname '*api*'
            exit 1
          fi
          echo "CMS correctly excluded from out/"
