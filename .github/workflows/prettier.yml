name: Prettier

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Prettier
        run: npm run prettier -- --write

      - name: Commit and push changes
        env:
          # head_ref is only set on pull_request; ref_name covers push events.
          # Passed via env rather than inlined so a branch name cannot inject shell.
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Automatically format code with Prettier" || echo "No changes to commit"
          git push origin "HEAD:${TARGET_BRANCH}" || echo "Push rejected (branch protection?) - formatting was NOT persisted"
