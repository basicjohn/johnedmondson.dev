version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: Strict-Transport-Security
          value: "max-age=63072000; includeSubDomains; preload"
        - key: X-Content-Type-Options
          value: "nosniff"
        - key: X-Frame-Options
          value: "DENY"
        - key: Referrer-Policy
          value: "strict-origin-when-cross-origin"
        - key: Permissions-Policy
          value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdnjs.buymeacoffee.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.execute-api.us-east-2.amazonaws.com https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com; frame-src https://basicjohn.substack.com; object-src 'none'; base-uri 'self'; form-action 'self'"
